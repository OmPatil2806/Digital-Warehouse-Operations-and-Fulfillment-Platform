[project]
name = "warehouse-ml"
version = "0.6.0"
description = "Synthetic data generation and machine learning for the Digital Warehouse platform"
requires-python = ">=3.12"

# Same style rules as the backend.
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["data_generation", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `data_generation` from ml/, and the backend's `app` package for the database models.
pythonpath = [".", "../backend"]
addopts = "-ra -q"
