[project]
name = "warehouse-backend"
version = "0.9.0"
description = "FastAPI backend for the Digital Warehouse Operations and Fulfillment Platform"
requires-python = ">=3.12"

# ---------- Black (formatter) ----------
[tool.black]
line-length = 100
target-version = ["py312"]

# ---------- Ruff (linter) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI uses function calls in default arguments (Depends)
]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

# ---------- Coverage (pytest --cov) ----------
# Statements and branches of the application code that the tests run. CI fails below
# `fail_under`; `pytest --cov` prints the files with gaps and the lines they miss.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 96
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
