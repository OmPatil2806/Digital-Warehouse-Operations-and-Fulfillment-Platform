name: ML CI

on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - "backend/**"
      - "scripts/generate_data.py"
      - "scripts/train_models.py"
      - "scripts/score_models.py"
      - "scripts/check_models.py"
      - "scripts/seed_database.py"
      - ".github/workflows/ml-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml/**"
      - "backend/**"
      - "scripts/generate_data.py"
      - "scripts/train_models.py"
      - "scripts/score_models.py"
      - "scripts/check_models.py"
      - "scripts/seed_database.py"
      - ".github/workflows/ml-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: Lint and test data generation (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check . --output-format=github

      - name: Format check (Black)
        run: black --check .

      - name: Run tests (Pytest)
        run: pytest -v

      - name: Generate and validate the small dataset
        run: |
          python ../scripts/generate_data.py --size small --database "$RUNNER_TEMP/synthetic.db"
          cat "$RUNNER_TEMP/synthetic_validation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Train every use case quickly on the small dataset (smoke test)
        run: |
          python ../scripts/train_models.py --database "$RUNNER_TEMP/synthetic.db" --quick \
            --no-reports --overview "$RUNNER_TEMP/overview.md"
          cat "$RUNNER_TEMP/overview.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Score every use case with the selected models (smoke test)
        run: python ../scripts/score_models.py --database "$RUNNER_TEMP/synthetic.db"

      - name: Check the selected models load and their predictions are complete and valid
        run: |
          set -o pipefail
          python ../scripts/check_models.py --database "$RUNNER_TEMP/synthetic.db" | tee "$RUNNER_TEMP/checks.txt"
          { echo "### Model and prediction checks"; echo '```'; cat "$RUNNER_TEMP/checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Backtest demand and delays as of 20 days before the end (smoke test)
        run: python ../scripts/score_models.py --database "$RUNNER_TEMP/synthetic.db" --backtest 20
