name: Delivery

# Builds the release package (scripts/build_release.py): the project, the built web app
# and an install guide in one zip, with its SHA-256 checksum. The package is unpacked and
# smoke-tested: a fresh database from its migrations, demo data, the API answering.
#
# - every push to main: the package is built and tested (kept 14 days as a download), so
#   a broken release is noticed before tagging;
# - a version tag (git tag -a v1.0.0 ... ; git push origin v1.0.0): all test suites run
#   too, the tag must match the version in the code, and when everything passes the zip
#   and its checksum are published as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ---------------------------------------------------------------- tests (tags only)
  backend-tests:
    name: Backend tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && black --check .
      - run: pytest --cov

  frontend-tests:
    name: Frontend tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: npm run test:coverage

  ml-tests:
    name: ML tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            backend/requirements*.txt
      - run: pip install -r requirements.txt
      - run: ruff check . && black --check .
      - run: pytest

  # ------------------------------------------------------------- package (every run)
  package:
    name: Build and smoke-test the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Build the package
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python scripts/build_release.py --version "$TAG" --output release
          else
            python scripts/build_release.py --output release
          fi
          (cd release && sha256sum -c SHA256SUMS)

      - name: Smoke-test the unpacked package
        run: |
          set -euo pipefail
          unzip -q release/*.zip -d "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP"/pkg/*/
          test -f frontend/dist/index.html
          test -f INSTALL.md
          pip install -r backend/requirements.txt
          export APP_ENV=development DATABASE_URL="sqlite:///$RUNNER_TEMP/smoke.db"
          (cd backend && alembic upgrade head)
          python scripts/seed_database.py > /dev/null
          (cd backend && uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null && break || sleep 1
          done
          token=$(curl -fsS http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"manager@example.com","password":"Demo-pass-123"}' \
            | python -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $token" \
            http://127.0.0.1:8000/api/v1/dashboards/overview > /dev/null
          echo "The packaged API migrated, loaded demo data, logged in and served the dashboard."

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: release/
          retention-days: 14

  # ------------------------------------------------------------- release (tags only)
  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [backend-tests, frontend-tests, ml-tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      - name: Get the package
        uses: actions/download-artifact@v7
        with:
          name: release-package
          path: release

      - name: Create the release (or update its files when re-run)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip release/SHA256SUMS --clobber
          else
            gh release create "$TAG" release/*.zip release/SHA256SUMS \
              --verify-tag --title "$TAG" --notes-file release/INSTALL.md
          fi
